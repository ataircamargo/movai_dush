move_base:  # dynamic teb parameters (these parameters are reconfigurable with the annotations in navigation.yaml)
  TebLocalPlannerROS:                            #TEB default   (http://wiki.ros.org/teb_local_planner)
    acc_lim_theta: 0.1                          #0.5
    acc_lim_x: 0.5                               #0.5
    cmd_angle_instead_rotvel: false              #false
    max_vel_theta: 0.1                          #0.3
    max_vel_x: 0.5                               #0.2
    max_vel_y: 0.1                               #0.2
    acc_lim_y: 0.2                               #0.2
    weight_acc_lim_x: 100                        #1.0
    weight_kinematics_forward_drive: 10          #1.0
    weight_kinematics_turning_radius: 10         #1.0
    weight_max_vel_x: 50                         #2.0
    weight_acc_lim_theta: 50                   #1.0
    weight_max_vel_theta: 50                   #1.0
    wheelbase: 0.0                               #1.0
    dt_ref: 0.3                                  #0.3
    dt_hysteresis: 0.1                           #0.1
    weight_optimaltime: 1                        #1.0
    min_obstacle_dist: 0.5                       #0.5
    include_costmap_obstacles: false             #true
    global_plan_viapoint_sep: 0.5                #-0.1
    xy_goal_tolerance: 0.2                       #0.2
    yaw_goal_tolerance: 0.1                      #0.2
    max_number_classes: 2                        #4
    weight_viapoint: 50                        #1.0
    weight_shortest_path: 40                      #0
    global_plan_overwrite_orientation: true      #true
    allow_init_with_backwards_motion: false      #false
    costmap_obstacles_behind_robot_dist: 1.0     #1.0
    enable_multithreading: true                  #true
    feasibility_check_no_poses: 0                #4
    footprint_model: {}                          #"point"
    free_goal_vel: false                         #false
    h_signature_prescaler: 1.0                   #1.0
    h_signature_threshold: 0.1                   #0.1
    inflation_dist: 0.6                          #0.6
    max_global_plan_lookahead_dist: 8.0          #3.0
    no_inner_iterations: 5                       #5
    no_outer_iterations: 4                       #4
    obstacle_heading_threshold: 1.0              #1.0
    obstacle_poses_affected: 10                  #30
    optimization_activate: true                  #true
    optimization_verbose: false                  #false
    oscillation_recovery: true                   #true
    penalty_epsilon: 0.05                        #0.1
    publish_feedback: false                      #false
    roadmap_graph_area_width: 6.0                #6
    roadmap_graph_no_samples: 15                 #15
    selection_alternative_time_cost: false       #false
    selection_viapoint_cost_scale: 1             #1.0
    teb_autosize: true                           #true
    viapoints_all_candidates: true               #true
    visualize_hc_graph: false                    #false
    weight_dynamic_obstacle: 1                   #0.1
    weight_inflation: 1                          #0.1
    weight_kinematics_nh: 1000                   #1000
    weight_obstacle: 50                          #50
    max_vel_x_backwards: 0.1                 #0.2
    roadmap_graph_area_length_scale: 1           #1

  global_costmap:           # dynamic global costmap params
    publish_frequency: 1
    transform_tolerance: 1.5
    update_frequency: 5
    footprint: {"type":"circular", "radius":0.35}
    static_layer:
      enabled: true
    inflation_layer:
      enabled: true
      inflation_radius: 0.1
    obstacle_layer:
      enabled: false
      max_obstacle_height: 2.5
      combination_method: 1
    rgbd_obstacle_layer:
      enabled:               false
      voxel_decay:           0.5    #seconds if linear, e^n if exponential
      decay_model:           0      #0=linear, 1=exponential, -1=persistent
      voxel_size:            0.10   #meters
      track_unknown_space:   false  #default space is unknown
      mark_threshold:        0      #voxel height
      update_footprint_enabled: false  # cleans where the robot footprint is
      combination_method:    1      #1=max, 0=override
      publish_voxel_map:     true   # default off
      mapping_mode:          false  # default off, saves map not for navigation
      map_save_duration:     60     #default 60s, how often to autosave

  local_costmap:             # dynamic local costmap params
    height: 8
    width: 8
    origin_x: 0
    origin_y: 0
    publish_frequency: 5
    resolution: 0.05
    transform_tolerance: 1.5
    update_frequency: 5
    footprint: {"type":"circular", "radius":0.35}
    static_layer:
      enabled: true
    inflation_layer:
      enabled: true
      inflation_radius: 0.10
    obstacle_layer:
      enabled: false
      max_obstacle_height: 2.5
      combination_method: 1    
    rgbd_obstacle_layer:
      enabled:               true
      voxel_decay:           0.5    #seconds if linear, e^n if exponential
      decay_model:           0      #0=linear, 1=exponential, -1=persistent
      voxel_size:            0.01   #meters
      track_unknown_space:   false  #default space is unknown
      mark_threshold:        0      #voxel height
      update_footprint_enabled: false  # cleans where the robot footprint is
      combination_method:    1      #1=max, 0=override
      publish_voxel_map:     true   # default off
      mapping_mode:          false  # default off, saves map not for navigation
      map_save_duration:     60     #default 60s, how often to autosave



# static parameters
teb_static:      # static teb parameters 
    costmap_converter_plugin: ""                 #""
    costmap_converter_spin_thread: true          #true
    costmap_converter_rate: 5                    #5.0
    enable_homotopy_class_planning: true         #true
    #odom_topic: "/wheels_controller/odom"       #"odom"
    map_frame: "/map"                            #"odom"
    complete_global_plan: false                  #true

global_costmap_static:   # static global costmap parameters  
  always_send_full_costmap: false
  global_frame: map
  map_type: costmap
  publish_voxel_map: false
  robot_base_frame: base_link
  rolling_window: false
  static_map: true   

  static_layer:
    map_topic: '/map'
    lethal_cost_threshold: 100
    trinary_costmap: true        
  obstacle_layer:
    inf_is_valid: true
    observation_sources: laser1 laser2
    obstacle_range: 5
    raytrace_range: 5
    track_unknown_space: false
    laser1:
      clearing: true
      data_type: LaserScan
      marking: true
      observation_persistence: 0
      topic: "/laser_front/scan"
    laser2:
      clearing: true
      data_type: LaserScan
      marking: truerobot_rad
      observation_persistence: 0
      topic: "/lidar/scan"
  rgbd_obstacle_layer:
    observation_persistence: 0.0  #seconds
    max_obstacle_height:   1.7    #meters
    unknown_threshold:     15     #voxel height
    origin_z:              0.0    #meters
    transform_tolerance:   0.2    # seconds
    observation_sources:   rgbd1_mark rgbd1_clear rgbd2_mark rgbd2_clear
    rgbd1_mark:
      data_type: LaserScan
      topic: /scan_front/scan
      marking: true
      clearing: false
      obstacle_range: 5.0         # meters
      min_obstacle_height: 0.2     # default 0, meters 0.2 in the lab
      max_obstacle_height: 2.0     # default 3, meters
      expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
      observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
      inf_is_valid: false          # default false, for laser scans
      filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
      voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
      clear_after_reading: false   # default false, clear the buffer after the layer gets readings from it
    rgbd1_clear:
      data_type: LaserScan
      topic: /scan_front/scan
      marking: false
      clearing: true
      max_z: 5.0                   # default 0, meters
      min_z: 0.2                   # default 10, meters
      vertical_fov_angle: 0.2      # default 0.7, radians
      horizontal_fov_angle: 3.14   # default 1.04, radians
      decay_acceleration: 0        # default 0, 1/s^2. If laser scanner MUST be 0
      model_type: 1
    rgbd2_mark:
      data_type: PointCloud2
      topic: /lidar/points
      marking: true
      clearing: false
      obstacle_range: 5.0         # meters
      min_obstacle_height: 0.3 #0.5     # default 0, meters 0.2 in the lab
      max_obstacle_height: 2.0     # default 3, meters
      expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
      observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
      inf_is_valid: false          # default false, for laser scans
      filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
      voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
      clear_after_reading: false   # default false, clear the buffer after the layer gets readings from it
    rgbd2_clear:
      data_type: PointCloud2
      topic: /lidar/points
      marking: false
      clearing: true
      max_z: 5.0                   # default 0, meters
      min_z: 0.2                   # default 10, meters
      vertical_fov_angle: 0.9      # default 0.7, radians
      horizontal_fov_angle: 6.28   # default 1.04, radians
      decay_acceleration: 0        # default 0, 1/s^2. If laser scanner MUST be 0
      model_type: 1  
 

  plugins:
    -
      name: static_layer
      type: "costmap_2d::StaticLayer"
    -
      name: obstacle_layer
      type: "costmap_2d::ObstacleLayer"
    -
      name: rgbd_obstacle_layer
      type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
    - 
      name: inflation_layer
      type: "costmap_2d::InflationLayer"

local_costmap_static:    # static local costmap parameters 
  global_frame: map
  map_type: costmap
  publish_voxel_map: false
  robot_base_frame: base_link
  rolling_window: true
  static_map: false  

  obstacle_layer:
    inf_is_valid: true
    observation_sources: laser1 laser2
    obstacle_range: 5
    raytrace_range: 5
    track_unknown_space: false
    laser1:
      clearing: true
      data_type: LaserScan
      marking: true
      observation_persistence: 0
      topic: "/laser_front/scan"
    laser2:
      clearing: true
      data_type: LaserScan
      marking: true
      observation_persistence: 0
      topic: "/lidar/scan"
  rgbd_obstacle_layer:
    observation_persistence: 0.0  #seconds
    max_obstacle_height:   1.7    #meters
    unknown_threshold:     15     #voxel height
    origin_z:              0.0    #meters
    transform_tolerance:   0.2    # seconds
    observation_sources:   rgbd1_mark rgbd11_clear #rgbd3_mark #rgbd1_clear #
    rgbd1_mark:
      data_type: LaserScan
      topic: /lidar/scan   
      marking: true
      clearing: false
      obstacle_range: 5.0         # meters
      min_obstacle_height: 0.2     # default 0, meters 0.2 in the lab
      max_obstacle_height: 2.0     # default 3, meters
      expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
      observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
      inf_is_valid: false          # default false, for laser scans
      filter: "voxel"        # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
      voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
      clear_after_reading: false   # default false, clear the buffer after the layer gets readings from it
    rgbd11_clear:
      data_type: LaserScan
      topic: /lidar/scan  
      marking: false
      clearing: true
      max_z: 5.0                   # default 0, meters
      min_z: 0.2                   # default 10, meters
      vertical_fov_angle: 0.7      # default 0.7, radians
      horizontal_fov_angle: 3.14   # default 1.04, radians
      decay_acceleration: 0        # default 0, 1/s^2. If laser scanner MUST be 0
      model_type: 1  

  path_scorer_layer:
    enabled: true
    path_topic: "/path"
    path_timeout: 0.2
    publish_markers: True

  plugins:
    -
      name: static_layer
      type: "costmap_2d::StaticLayer"
    -
      name: obstacle_layer
      type: "costmap_2d::ObstacleLayer"
    -
      name: rgbd_obstacle_layer
      type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
    -
      name: inflation_layer
      type: "costmap_2d::InflationLayer"
    -
      name: path_scorer_layer
      type: "movai::PathScorerLayer"


##

footprint: {"type":"circular", 'radius':0.35}
footprint_padding: 0.0

global_planner:
  run_with_loops_flag: false        # if false, abort when Dubins loops are detected; only true for visualization purposes with the nav_visualization flow
  optimise_shortest_path: false     # if false path merging adopts a segment-by-segment approach
  planner_frequency: 0              # If the frequency is set to 0.0, the global planner will only run when a new goal is received or the local planner reports that its path is blocked
  max_planning_retries: 0
  enable_astar_expansion_vis: false
  max_segment_distance: 10          # when optimise_shortest_path is false, max distance of a segment from the robot, to which it is allowed to plan.

graph_nav:
  max_start_distance: 1.5             # [float] Maximum radius within which to search for graph elements
  debug_flag: false                 # TODO add debug level in new graph nav
  cost_links: 2                     # [float] Cost attributed to free segments in the graph (yellow dashed links in the GraphicScene)
  cost_merge_to_graph: 3            # [float] Cost applied to free-space path connecting robot to graph

smoother:
  min_obstacle_dist: 1.5

undock:                          # The format is a list of dict {"nav_type":"move_distance" or "rotate", "goal": Number, "params": {}}
  navigation_steps:
    - nav_type: move_distance
      goal: -1
    - nav_type: rotate
      goal: 180
